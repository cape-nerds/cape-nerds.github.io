/* Layout: one letterboxed cinema stage centred in the viewport, controls reduced to glyphs */
:root {
  --ink: #07060d;          /* deep indigo-black ground */
  --paper: #e6d8bd;        /* paper cream for glyphs */

.btn {

<script>
try {
/* ===== CORE: helpers, materials, shard merging ===== */
const T = THREE;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function rng(seed) { let s = seed >>> 0; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
const R = rng(20261024);
const rr = (a, b) => a + (b - a) * R();

const PAL = {
  skyTop: 0x24234f, skyMid: 0x6d3568, skyLow: 0xd9704f, skyHot: 0xf2b45a,
  fog: 0xb86a63,
  teal: 0x2d6a68, tealDark: 0x1d4a50, indigo: 0x3b3f7a, plum: 0x5a2d62,
  sand: 0xd2a15f, mustard: 0xd6a53a, coral: 0xd9694a, cream: 0xe6d8bd,
  ink: 0x15131f, steel: 0x8f98ab, gold: 0xe0b24a,
  skinNovice: 0x8f5f3c, skinCat: 0xa8744c, skinPedro: 0xc8946a, skinNYF: 0xcf9d74,
  dragonRed: 0xb3261e, dragonDark: 0x6a1418, dragonHot: 0xe0502e, dragonBone: 0xe7c9a0

/* paper grain texture (subtle fibres) */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

    const v = 205 + (r() * 50) | 0;
    g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (0.25 + r() * 0.4) + ')';
    g.fillRect(r() * 256, r() * 256, 1 + r() * 2, 1);

    g.strokeStyle = 'rgba(255,255,255,' + (0.1 + r() * 0.15) + ')';

const matCache = {};

  const m = new T.MeshStandardMaterial(Object.assign({ color, roughness: 0.95, metalness: 0, flatShading: true, map: grainTex }, o));

}
const basic = (color, o = {}) => new T.MeshBasicMaterial(Object.assign({ color }, o));

function mesh(geo, m, shadow = true) {

}
function box(w, h, d, m) { return mesh(new T.BoxGeometry(w, h, d), m); }

/* merge many shards into one flat-shaded vertex-coloured mesh */
class Shards {
  constructor() { this.pos = []; this.col = []; this._c = new T.Color(); }
  add(geo, matrix, color) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    g.applyMatrix4(matrix);

    this._c.set(color);

      this.pos.push(p[i], p[i + 1], p[i + 2]);

    const g = new T.BufferGeometry();

    g.setAttribute('color', new T.Float32BufferAttribute(this.col, 3));

  tet: new T.TetrahedronGeometry(1, 0),
  oct: new T.OctahedronGeometry(1, 0),
  ico: new T.IcosahedronGeometry(1, 0),
  cone4: new T.ConeGeometry(1, 2, 4, 1),
  cone5: new T.ConeGeometry(1, 2, 5, 1),
  box: new T.BoxGeometry(1, 1, 1)

const world = { scene: new T.Scene(), objs: {} };
const scene = world.scene;

const SUN_POS = new T.Vector3(-110, 85, -300);

const roadX = z => Math.sin(z * 0.035) * 7 + Math.sin(z * 0.011 + 1) * 5;

const MOUNT = new T.Vector3(roadX(-112) * 0.6, 0, -112);

scene.background = new T.Color(PAL.skyLow);

/* sky group follows the camera so it has no parallax */

    side: T.BackSide, depthWrite: false, fog: false,
    uniforms: {

    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vDir; uniform vec3 top,mid,low,hot,sunDir; void main(){ float h = vDir.y; vec3 c = mix(low, mid, smoothstep(0.0,0.26,h)); c = mix(c, top, smoothstep(0.2,0.8,h)); float s = max(dot(vDir,sunDir),0.0); c += hot*pow(s,9.0)*0.5 + hot*pow(s,70.0)*0.45; c = mix(c, low*0.85, smoothstep(0.0,-0.25,h)); gl_FragColor = vec4(c,1.0); }'

sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);

/* paper road: instanced plates following the curve */
(function road() {
  const N = 150, z0 = 70, z1 = -215, step = (z1 - z0) / N;
  const geo = new T.BoxGeometry(1, 0.3, 1);
  const rm = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true, map: grainTex });
  const im = new T.InstancedMesh(geo, rm, N * 3); im.receiveShadow = true;
  const dummy = new T.Object3D(), col = new T.Color(); const r = rng(5); let k = 0;
  for (let i = 0; i < N; i++) {
    const z = z0 + i * step, x = roadX(z), yaw = Math.atan2(roadDX(z), 1);
    for (let s = -1; s <= 1; s++) {
      const wide = s === 0 ? 5.4 : 0.9, off = s * 3.1;
      dummy.position.set(x + Math.cos(yaw) * off, s === 0 ? 0.15 : 0.08, z - Math.sin(yaw) * off);
      dummy.rotation.set(0, yaw, 0); dummy.scale.set(wide, 1, Math.abs(step) * 1.25);
      dummy.updateMatrix(); im.setMatrixAt(k, dummy.matrix);
      col.set(s === 0 ? 0xd2a15f : 0x9a6a46); col.multiplyScalar(0.92 + r() * 0.16); im.setColorAt(k, col); k++;
    }
  }
  scene.add(im);
})();

/* paper-cut ridges (extruded silhouettes) */
function silhouette(len, base, amp, seed, jag) {
  const pts = [], r = rng(seed);
  const ph = [r() * 6, r() * 6, r() * 6];
  for (let u = 0; u <= len; u += jag) {
    const h = base + amp * (0.55 * Math.sin(u * 0.03 + ph[0]) + 0.3 * Math.sin(u * 0.071 + ph[1]) + 0.15 * Math.sin(u * 0.19 + ph[2])) + (r() - .5) * amp * 0.35;
    pts.push([u, Math.max(1, h)]);
  }
  return pts;
}
function extrudeSil(pts, depth, color, bottom = -6) {
  const sh = new T.Shape(); sh.moveTo(pts[0][0], bottom);
  pts.forEach(p => sh.lineTo(p[0], p[1]));
  sh.lineTo(pts[pts.length - 1][0], bottom); sh.closePath();
  const g = new T.ExtrudeGeometry(sh, { depth, bevelEnabled: false, steps: 1 });
  return mesh(g, mat(color));
}
(function ridges() {
  const cols = [0x2d6a68, 0x2f6277, 0x35588a, 0x40508f, 0x4a4a92, 0x56468f];
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 6; i++) {
      const pts = silhouette(360, 5 + i * 3.6, 7 + i * 1.6, 40 + i * 7 + (side > 0 ? 100 : 0), 4.5);
      const me = extrudeSil(pts, 7, cols[i]);
      me.rotation.y = Math.PI / 2;                     /* local x -> world -z, local z -> world +x */
      me.position.set(side * (24 + i * 15) - (side < 0 ? 7 : 0), 0, 90);
      scene.add(me);
    }
  }
  /* far backdrop ranges across the horizon */
  const bc = [0x4a3f86, 0x5b3f86, 0x6e4388, 0x86497f, 0xa4586f];
  for (let j = 0; j < 5; j++) {
    const pts = silhouette(520, 22 + j * 3, 22 - j * 1.5, 300 + j * 11, 7).map(p => [p[0] - 260, p[1]]);
    const me = extrudeSil(pts, 4, bc[j], -10);
    me.position.set(0, 0, -165 - j * 22); scene.add(me);
  }
})();

/* the mountain: jagged slabs that can split apart */
function jaggedFrustum(rb, rt, h, seg, color, seed) {
  const g = new T.CylinderGeometry(rt, rb, h, seg, 2, false); const p = g.attributes.position; const r = rng(seed);
  for (let i = 0; i < p.count; i++) {
    const k = 1 + (r() - .5) * 0.3;
    p.setXYZ(i, p.getX(i) * k, p.getY(i) + (r() - .5) * h * 0.08, p.getZ(i) * k);
  }
  g.computeVertexNormals();
  return mesh(g, mat(color));
}
const mountain = { left: new T.Group(), right: new T.Group(), pieces: [], crater: null };
(function mountainBuild() {
  const base = new T.Group(); base.position.copy(MOUNT); scene.add(base); mountain.root = base;
  const cols = [0x2b2250, 0x37285e, 0x2a2a5a, 0x41306a];
  /* left and right shoulders */
  const L = [[-17, 0, 3, 15, 27], [-33, 0, 8, 17, 20], [-10, 0, 8, 10, 15]];
  const Rr = [[18, 0, 1, 14, 25], [34, 0, 7, 16, 18], [11, 0, 8, 10, 14]];
  L.forEach((a, i) => { const c = jaggedFrustum(a[3], 0.6, a[4], 6, cols[i], 11 + i); c.position.set(a[0], a[4] / 2, a[2]); mountain.left.add(c); });
  Rr.forEach((a, i) => { const c = jaggedFrustum(a[3], 0.6, a[4], 6, cols[(i + 1) % 4], 21 + i); c.position.set(a[0], a[4] / 2, a[2]); mountain.right.add(c); });
  base.add(mountain.left); base.add(mountain.right);
  /* centre peak: stacked slabs + spikes that burst outward */
  const slabs = [[0, 7, 14, 15, 11, 0x35285c], [0, 21, 14, 11, 7, 0x2e2552], [0, 33, 12, 7, 0.5, 0x3d2d66]];
  slabs.forEach((s, i) => {
    const m = jaggedFrustum(s[3], s[4], s[2], 7, s[5], 31 + i); m.position.set(s[0], s[1], 0);
    base.add(m); mountain.pieces.push({ m, p0: m.position.clone(), v: new T.Vector3((i - 1) * 3, 6 + i * 3, -2 + i), spin: new T.Vector3(rr(-.6, .6), rr(-.5, .5), rr(-.6, .6)), r: 5 });
  });
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2, rad = 9 + R() * 4;
    const sp = mesh(new T.ConeGeometry(2.4 + R() * 2, 10 + R() * 12, 5), mat(cols[i % 4]));
    sp.position.set(Math.cos(a) * rad, 5 + R() * 6, Math.sin(a) * rad * 0.6);
    sp.rotation.set((R() - .5) * 0.3, R() * 6, (R() - .5) * 0.3); base.add(sp);
    mountain.pieces.push({ m: sp, p0: sp.position.clone(), v: new T.Vector3(Math.cos(a) * 9, 10 + R() * 8, Math.sin(a) * 6 - 2), spin: new T.Vector3(rr(-1, 1), rr(-1, 1), rr(-1, 1)), r: 2 });
  }
  /* glowing crater */
  const cr = new T.Mesh(new T.CircleGeometry(15, 8), basic(0xff6a2a, { fog: false, transparent: true, opacity: 0 }));
  cr.rotation.x = -Math.PI / 2; cr.position.y = 0.4; base.add(cr); mountain.crater = cr;
  const glow = new T.PointLight(0xff6a2a, 0, 120, 2); glow.position.set(0, 6, 4); base.add(glow); mountain.glow = glow;
})();
const T_CRACK = 35.0;
function updateMountain(t) {
  const tau = Math.max(0, t - T_CRACK), g = 14;
  const open = easeOut(clamp(tau / 4.5));
  mountain.left.position.set(-open * 13, -open * 2.2, -open * 1.5); mountain.left.rotation.z = open * 0.11;
  mountain.right.position.set(open * 13, -open * 2.2, -open * 1.5); mountain.right.rotation.z = -open * 0.11;
  mountain.pieces.forEach(pc => {
    const x = pc.p0.x + pc.v.x * tau, z = pc.p0.z + pc.v.z * tau;
    let y = pc.p0.y + pc.v.y * tau - 0.5 * g * tau * tau; const floor = pc.r * 0.3 - 1;
    if (y < floor) y = floor;
    pc.m.position.set(x, y, z);
    const ts = Math.min(tau, 3.2); pc.m.rotation.set(pc.spin.x * ts, pc.spin.y * ts, pc.spin.z * ts);
  });
  mountain.crater.material.opacity = sm(T_CRACK, T_CRACK + 2.5, t) * 0.85;
  mountain.glow.intensity = sm(T_CRACK, T_CRACK + 3, t) * (2.6 + Math.sin(t * 13) * 0.5);
}

/* trees, grass, rocks (instanced) */
(function scatter() {
  const r = rng(77), dummy = new T.Object3D(), col = new T.Color();
  const treeMat = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true, map: grainTex });
  const levels = [[1.5, 2.4, 1.0], [1.15, 2.1, 2.1], [0.8, 1.8, 3.1]];
  const N = 260, ims = levels.map(l => { const im = new T.InstancedMesh(new T.ConeGeometry(l[0], l[1], 5), treeMat, N); im.castShadow = true; im.receiveShadow = true; return im; });
  let n = 0;
  while (n < N) {
    const z = 50 - r() * 210, side = r() < .5 ? -1 : 1, off = 7.5 + Math.pow(r(), 1.3) * 34;
    const x = roadX(z) + side * off, s = 0.8 + r() * 1.1, yaw = r() * 6;
    const c = [0x1f5a58, 0x24655f, 0x2b5a72, 0x3b4f86, 0x2a6a50][(r() * 5) | 0]; col.set(c).multiplyScalar(0.9 + r() * 0.2);
    levels.forEach((l, i) => {
      dummy.position.set(x, l[2] * s + l[1] * s * 0.5 - 0.2, z); dummy.rotation.set(0, yaw + i, 0); dummy.scale.set(s, s, s);
      dummy.updateMatrix(); ims[i].setMatrixAt(n, dummy.matrix); ims[i].setColorAt(n, col);
    });
    n++;
  }
  ims.forEach(im => scene.add(im));
  /* rocks */
  const rk = new T.InstancedMesh(new T.OctahedronGeometry(1, 0), new T.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true, map: grainTex }), 90);
  rk.castShadow = rk.receiveShadow = true;
  for (let i = 0; i < 90; i++) {
    const z = 40 - r() * 200, side = r() < .5 ? -1 : 1, x = roadX(z) + side * (4.2 + r() * 12), s = 0.3 + r() * 0.9;
    dummy.position.set(x, s * 0.4, z); dummy.rotation.set(r() * 3, r() * 3, r() * 3); dummy.scale.set(s * 1.4, s, s * 1.1);
    dummy.updateMatrix(); rk.setMatrixAt(i, dummy.matrix); rk.setColorAt(i, col.set([0x6b6a8c, 0x7d6a88, 0x59597f][i % 3]));
  }
  scene.add(rk);
  /* swaying paper grass */
  const gg = new T.ConeGeometry(0.14, 1, 3); gg.translate(0, 0.5, 0);
  const gm = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true });
  const uni = { uTime: { value: 0 } }; world.objs.grassUni = uni;
  gm.onBeforeCompile = sh => {
    sh.uniforms.uTime = uni.uTime;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n#ifdef USE_INSTANCING\n transformed.x += sin(uTime*2.2 + instanceMatrix[3].x*0.6 + instanceMatrix[3].z*0.35)*0.28*position.y;\n transformed.z += cos(uTime*1.7 + instanceMatrix[3].z*0.5)*0.12*position.y;\n#endif');
  };
  const GN = 1100, gi = new T.InstancedMesh(gg, gm, GN); gi.receiveShadow = true; gi.castShadow = true;
  for (let i = 0; i < GN; i++) {
    const z = 55 - r() * 190, side = r() < .5 ? -1 : 1, x = roadX(z) + side * (3.4 + Math.pow(r(), 1.5) * 20), s = 0.7 + r() * 1.1;
    dummy.position.set(x, 0, z); dummy.rotation.set(0, r() * 6, 0); dummy.scale.set(s, s * (0.8 + r() * 0.8), s);
    dummy.updateMatrix(); gi.setMatrixAt(i, dummy.matrix);
    gi.setColorAt(i, col.set([0x3f8a6a, 0x4f9a68, 0x6aa05c, 0x358074][i % 4]).multiplyScalar(0.85 + r() * 0.3));

/* ===== HEROES: chibi paper-craft rigs (no mouths) ===== */
const skinMat = c => new T.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: false });
const eyeWhite = new T.MeshBasicMaterial({ color: 0xf4ecd8 });
const eyeDark = new T.MeshBasicMaterial({ color: 0x14111c });
const hairMat = new T.MeshStandardMaterial({ color: 0x14121a, roughness: 0.85, flatShading: true, map: grainTex });

function makeEye(side, o) {
  const g = new T.Group();
  const w = new T.Mesh(new T.CircleGeometry(0.2, 18), eyeWhite); w.scale.set(1, 1.15, 1); g.add(w);
  const pu = new T.Mesh(new T.CircleGeometry(0.11, 14), eyeDark); pu.position.set(o.px * side + (o.gx || 0), o.py, 0.01); pu.scale.set(1, 1.15, 1); g.add(pu);
  const hl = new T.Mesh(new T.CircleGeometry(0.03, 8), eyeWhite); hl.position.set(o.px * side + (o.gx || 0) + 0.04, o.py + 0.05, 0.02); g.add(hl);
  /* upper lid: skin-coloured paper strip that slides down over the eye */
  const lid = new T.Mesh(new T.PlaneGeometry(0.44, 1), new T.MeshBasicMaterial({ color: o.lidColor })); lid.position.set(0, 0.23, 0.03); lid.scale.y = 0.001;
  g.add(lid);
  g.userData.lid = lid; g.userData.base = o.lid;
  /* brow */
  const brow = new T.Mesh(new T.BoxGeometry(0.42, 0.075, 0.06), hairMat);
  const by = 0.34 + o.browY + (o.browYS ? o.browYS[side > 0 ? 1 : 0] : 0); brow.position.set(0, by, 0.04); g.userData.by = by; brow.rotation.z = o.browTilt * side * -1 + (o.browExtra ? o.browExtra[side > 0 ? 1 : 0] : 0);
  g.add(brow); g.userData.brow = brow; g.userData.pu = pu; g.userData.hl = hl; g.userData.o = o;
  return g;
}

function makeHero(cfg) {
  const hero = new T.Group(); const parts = {};
  const sk = skinMat(cfg.skin);
  /* torso */
  const bodyG = new T.Group(); bodyG.position.y = 1.0; hero.add(bodyG); parts.body = bodyG;
  const torso = mesh(new T.BoxGeometry(1.0, 1.05, 0.68), mat(cfg.shirt)); torso.position.y = 0.5; bodyG.add(torso);
  const belt = box(1.04, 0.14, 0.72, mat(0x2a2030)); belt.position.y = 0.08; bodyG.add(belt);
  const trim = box(1.02, 0.1, 0.7, mat(cfg.trim)); trim.position.y = 0.95; bodyG.add(trim);
  /* legs */
  parts.legs = [-1, 1].map(s => {
    const lg = new T.Group(); lg.position.set(s * 0.26, 1.0, 0); hero.add(lg);
    const l = box(0.38, 0.8, 0.4, mat(cfg.pants)); l.position.y = -0.4; lg.add(l);
    const f = box(0.42, 0.22, 0.62, mat(0x2b2230)); f.position.set(0, -0.86, 0.08); lg.add(f); return lg;
  });
  /* arms */
  parts.arms = [-1, 1].map(s => {
    const a = new T.Group(); a.position.set(s * 0.64, 1.0 + 0.92, 0); hero.add(a);
    const u = box(0.3, 0.78, 0.32, mat(cfg.shirt)); u.position.y = -0.38; a.add(u);
    const h = mesh(new T.SphereGeometry(0.19, 8, 6), sk); h.position.y = -0.84; a.add(h); a.userData.hand = h; return a;
  });
  /* head */
  const head = new T.Group(); head.position.y = 1.0 + 1.05 + 0.82; hero.add(head); parts.head = head;
  const skull = mesh(new T.SphereGeometry(1, 20, 14), sk); skull.scale.set(1.0, 0.92, 0.96); head.add(skull);
  const ears = [-1, 1].map(s => { const e = mesh(new T.SphereGeometry(0.16, 8, 6), sk); e.position.set(s * 0.97, -0.05, 0); head.add(e); return e; });
  /* eyes */
  parts.eyes = [-1, 1].map(s => {
    const e = makeEye(s, cfg.eye); e.position.set(s * 0.38, 0.02, 0.89); e.rotation.y = s * 0.42; head.add(e); return e;
  });
  /* nose bump only (no mouth) */
  const nose = mesh(new T.SphereGeometry(0.09, 6, 5), sk); nose.position.set(0, -0.2, 0.97); head.add(nose);
  cfg.hair(head, hairMat, parts);
  if (cfg.glasses) cfg.glasses(head, parts);
  /* sword on back */
  const sword = new T.Group(); parts.sword = sword; bodyG.add(sword);
  const blade = mesh(new T.BoxGeometry(0.1, 1.9, 0.03), mat(0xc9d2e6, { roughness: 0.4, metalness: 0.4, map: null })); blade.position.y = 1.2; sword.add(blade);
  const tip = mesh(new T.ConeGeometry(0.07, 0.25, 4), mat(0xc9d2e6, { roughness: 0.4, metalness: 0.4, map: null })); tip.position.y = 2.28; tip.rotation.y = Math.PI / 4; sword.add(tip);
  const guard = box(0.55, 0.1, 0.12, mat(PAL.gold, { map: null })); guard.position.y = 0.2; sword.add(guard);
  const grip = box(0.12, 0.42, 0.12, mat(cfg.grip || 0x4a2a35)); grip.position.y = -0.05; sword.add(grip);
  const pommel = mesh(new T.OctahedronGeometry(0.12, 0), mat(PAL.gold, { map: null })); pommel.position.y = -0.3; sword.add(pommel);
  const strap = box(1.06, 0.1, 0.74, mat(0x2a2030)); strap.position.set(0, 0.6, 0); strap.rotation.z = 0.62; bodyG.add(strap);
  sword.userData.back = { p: new T.Vector3(0.08, 0.28, -0.55), r: new T.Euler(0.05, 0, 0.78) };
  sword.userData.drawn = { p: new T.Vector3(0.88, 0.95, 0.5), r: new T.Euler(0.45, 0, -0.1) };
  sword.position.copy(sword.userData.back.p); sword.rotation.copy(sword.userData.back.r);
  if (cfg.extra) cfg.extra(hero, bodyG, parts);
  hero.userData = { parts, cfg, walk: 0, draw: 0, arm: [0, 0], look: new T.Vector2(), blink: 0 };
  return hero;
}

/* animation: speed 0 idle, ~1 walk, 2 charge; draw 0..1 */
function animHero(h, t, speed, o = {}) {
  const u = h.userData, p = u.parts, ph = t * (5.2 + speed * 2.2) + (o.phase || 0);
  const amp = clamp(speed, 0, 1.6) * 0.62;
  p.legs[0].rotation.x = Math.sin(ph) * amp; p.legs[1].rotation.x = -Math.sin(ph) * amp;
  const idle = Math.sin(t * 1.6 + (o.phase || 0)) * 0.03;
  p.arms[0].rotation.x = -Math.sin(ph) * amp * 0.8 + idle; p.arms[1].rotation.x = Math.sin(ph) * amp * 0.8 - idle;
  p.arms[0].rotation.z = 0.06; p.arms[1].rotation.z = -0.06;
  p.body.position.y = 1.0 + Math.abs(Math.sin(ph)) * 0.09 * clamp(speed, 0, 1.6) + Math.sin(t * 1.6) * 0.012;
  p.body.rotation.z = Math.sin(ph) * 0.03 * speed;
  p.head.position.y = 1.0 + 1.05 + 0.82 + Math.abs(Math.sin(ph)) * 0.09 * clamp(speed, 0, 1.6);
  p.head.rotation.z = Math.sin(ph) * 0.03 * speed; p.head.rotation.y = (o.lookY || 0) * 1; p.head.rotation.x = (o.lookX || 0);
  /* sword draw */
  const d = o.draw || 0, S = p.sword, B = S.userData.back, D = S.userData.drawn, k = easeIO(d);
  S.position.lerpVectors(B.p, D.p, k);
  S.rotation.set(lerp(B.r.x, D.r.x, k), lerp(B.r.y, D.r.y, k), lerp(B.r.z, D.r.z, k));
  if (d > 0) {
    p.arms[1].rotation.x = lerp(p.arms[1].rotation.x, -2.4, k); p.arms[1].rotation.z = lerp(-0.06, -0.25, k);
  }
  /* blink + gaze */
  const bl = (Math.sin(t * 0.9 + (o.phase || 0) * 3) > 0.985 ? 1 : 0);
  p.eyes.forEach(e => {
    const eo = e.userData.o, lid = e.userData.lid;
    const cl = clamp(eo.lid + bl * 0.9 + (o.squint || 0), 0, 1);
    lid.scale.y = Math.max(0.001, cl * 0.46); lid.position.y = 0.23 - cl * 0.23;
    e.userData.pu.position.x = eo.px * (e.rotation.y > 0 ? 1 : -1) + (eo.gx || 0) + (o.gazeX || 0) * 0.07;
    e.userData.hl.position.x = e.userData.pu.position.x + 0.04;
    e.userData.brow.position.y = e.userData.by + (o.browLift || 0) * 0.06;
  });
  if (u.cfg.tick) u.cfg.tick(h, t, speed, ph);
}

/* ---- clean lofted construction: antiprism rings give sharp, readable interlocking triangles ---- */
Shards.prototype.tri = function (a, b, c, col) {

    pts.push(new T.Vector3(r.c[0] + r.u[0] * ca + r.v[0] * sa, r.c[1] + r.u[1] * ca + r.v[1] * sa, r.c[2] + r.u[2] * ca + r.v[2] * sa));

}
function loft(sh, rings, sides, colorFn, caps) {
  const P = rings.map((r, i) => ringPts(r, sides, (i % 2) * 0.5));
  for (let i = 0; i < P.length - 1; i++) {
    const A = P[i], B = P[i + 1];
    for (let j = 0; j < sides; j++) {
      const j1 = (j + 1) % sides;
      if (i % 2 === 0) { sh.tri(A[j], A[j1], B[j], colorFn(i, j, 0)); sh.tri(A[j1], B[j1], B[j], colorFn(i, j, 1)); }

    }

    const r = rings[k], c = new T.Vector3(r.c[0], r.c[1], r.c[2]);
    for (let j = 0; j < sides; j++) sh.tri(c, P[k][j], P[k][(j + 1) % sides], colorFn(k, j, 0));
